<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- soccer ball -->
  <g transform="translate(256 264)">
    <circle r="150" fill="#ffffff"/>
    <g fill="#0f172a">
      <!-- center pentagon -->
      <polygon points="0,-56 53,-17 33,46 -33,46 -53,-17"/>
      <!-- five outer hexagon strokes -->
    </g>
    <g fill="none" stroke="#0f172a" stroke-width="10" stroke-linejoin="round">
      <polygon points="0,-56 53,-17 33,46 -33,46 -53,-17"/>
      <line x1="0" y1="-56" x2="0" y2="-130"/>
      <line x1="53" y1="-17" x2="124" y2="-40"/>
      <line x1="33" y1="46" x2="76" y2="106"/>
      <line x1="-33" y1="46" x2="-76" y2="106"/>
      <line x1="-53" y1="-17" x2="-124" y2="-40"/>
    </g>
  </g>
  <!-- "WC 26" tag -->
  <g transform="translate(256 460)" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-weight="900">
    <text font-size="44" fill="#fcd34d">WC '26</text>
  </g>
</svg>
